name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  engine:
    name: engine binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/amminvention/vidhawk/internal/engine.Version=${VERSION}"
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" -o "dist/vidhawk-${os}-${arch}${ext}" ./cmd/vidhawk
          done
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: engine/dist/*
          generate_release_notes: true

  desktop-windows:
    name: desktop installer (Windows)
    runs-on: windows-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Build engine sidecar
        working-directory: engine
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X github.com/amminvention/vidhawk/internal/engine.Version=${env:GITHUB_REF_NAME}" -o ../desktop/resources/bin/vidhawk.exe ./cmd/vidhawk
      - name: Build installer
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
