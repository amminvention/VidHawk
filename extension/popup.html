<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VidHawk</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-hawk" viewBox="0 0 128 128"><path fill="currentColor" d="M10 46 64 72l54-26-14 12-40 32-40-32Z"/><path fill="currentColor" d="M64 72 54 50h20Z"/><path fill="#fff" d="M58 86h12v16H58z"/><path fill="#fff" d="M44 100h40l-20 20z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8V4Z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0Z"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3M6 3h4v8a2 2 0 0 0 4 0V3h4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
  </svg>

  <header class="top">
    <div class="brand">
      <svg class="brand-mark" aria-hidden="true"><use href="#i-hawk"/></svg>
      <span class="brand-name">VidHawk</span>
    </div>
    <button id="engineBtn" class="engine" type="button" title="Engine status — click to retry">
      <span class="dot" id="engineDot" aria-hidden="true"></span>
      <span id="engineText">Connecting…</span>
    </button>
  </header>

  <div id="engineBanner" class="banner" hidden>
    <svg aria-hidden="true"><use href="#i-alert"/></svg>
    <div>
      <strong>Engine not reachable.</strong>
      <span id="engineError"></span>
      Run <code>vidhawk install</code> once, then click retry.
    </div>
  </div>

  <main>
    <section class="section" aria-labelledby="mediaHead">
      <div class="section-head">
        <h2 id="mediaHead">On this page</h2>
        <span class="count" id="mediaCount" aria-live="polite"></span>
        <span class="spacer"></span>
        <span id="aiStatus" class="ai-status" aria-live="polite"></span>
        <button id="aiSuggest" class="btn ghost ai" type="button" title="Let Chrome's on-device model (Gemini Nano) pick the main video and name it" hidden>
          <svg aria-hidden="true"><use href="#i-sparkle"/></svg><span>Smart name</span>
        </button>
      </div>
      <ul id="mediaList" class="list" aria-label="Detected media"></ul>
      <details id="staleWrap" class="stale" hidden>
        <summary>Earlier on this tab</summary>
        <ul id="staleList" class="list"></ul>
      </details>
      <p id="segmentsNote" class="note" hidden></p>
      <div id="mediaEmpty" class="empty">
        <svg aria-hidden="true"><use href="#i-film"/></svg>
        <p>Nothing caught yet. Play the video, or reload the page with VidHawk open.</p>
      </div>
    </section>

    <section class="section" aria-labelledby="relatedHead" id="relatedSection" hidden>
      <div class="section-head">
        <h2 id="relatedHead">Related episodes</h2>
        <span class="count" id="relatedCount"></span>
      </div>
      <div class="row batch-bar">
        <button id="batchAll" class="btn" type="button" title="Open each page in the background, catch its stream and download it with series naming"><svg aria-hidden="true"><use href="#i-layers"/></svg><span>Catch &amp; download all</span></button>
        <label class="toggle" title="Download selected episodes only"><input type="checkbox" id="relatedSelectMode" /><span>Select</span></label>
        <span class="spacer"></span>
        <button id="relatedToggle" class="link" type="button" aria-expanded="false">Show list</button>
      </div>
      <ul id="relatedList" class="list compact" aria-label="Related episode links" hidden></ul>
      <div id="batchStatus" class="batch" hidden>
        <div class="row"><span id="batchText" class="note"></span><span class="spacer"></span><button id="batchStop" class="link" type="button">Stop</button><button id="batchClear" class="link" type="button" hidden>Clear</button></div>
        <div class="bar"><div class="fill" id="batchFill"></div></div>
      </div>
    </section>

    <section class="section" aria-labelledby="recentHead" id="recentSection" hidden>
      <div class="section-head">
        <h2 id="recentHead">Browser downloads</h2>
        <span class="count" id="recentCount"></span>
      </div>
      <ul id="recentList" class="list" aria-label="Recent browser downloads"></ul>
    </section>

    <section class="section" aria-labelledby="jobsHead">
      <div class="section-head">
        <h2 id="jobsHead">Downloads</h2>
        <button id="clearDone" class="link" type="button">Clear finished</button>
      </div>
      <ul id="jobList" class="list" aria-label="Downloads" aria-live="polite"></ul>
      <p id="jobsEmpty" class="empty-line">No downloads yet.</p>
    </section>
  </main>

  <footer>
    <form id="addForm" class="add">
      <label class="sr-only" for="addUrl">URL, magnet link or .torrent</label>
      <input id="addUrl" type="text" autocomplete="off" spellcheck="false" placeholder="Paste a URL, magnet: link or .torrent" />
      <button type="submit" class="btn primary" title="Add download">
        <svg aria-hidden="true"><use href="#i-download"/></svg><span>Add</span>
      </button>
    </form>
    <div class="footer-row folder-row">
      <label class="sr-only" for="defaultFolder">Default download folder</label>
      <svg aria-hidden="true"><use href="#i-folder"/></svg>
      <input id="defaultFolder" type="text" spellcheck="false" title="Default download folder (engine setting)" />
      <button id="saveFolder" class="btn ghost" type="button" hidden>Save</button>
    </div>
    <div class="footer-row">
      <button id="pageYtdlp" class="btn ghost" type="button" title="Hand the current page to yt-dlp (for sites that hide their streams)">
        <svg aria-hidden="true"><use href="#i-layers"/></svg><span>Grab page via yt-dlp</span>
      </button>
      <label class="toggle" title="Cancel the browser's own download of media and archives and send it to VidHawk">
        <input type="checkbox" id="takeOver" />
        <span>Take over downloads</span>
      </label>
    </div>
  </footer>

  <template id="mediaItemTpl">
    <li class="card media">
      <div class="row">
        <span class="kind" data-role="kind"></span>
        <input class="name" data-role="name" type="text" spellcheck="false" aria-label="File name" />
      </div>
      <div class="meta" data-role="meta"></div>
      <div class="row actions">
        <select class="quality" data-role="quality" aria-label="Quality" hidden></select>
        <span class="probe" data-role="probe" hidden></span>
        <span class="spacer"></span>
        <button class="icon" data-action="options" type="button" title="Folder and series options" aria-label="Folder and series options" aria-expanded="false"><svg aria-hidden="true"><use href="#i-settings"/></svg></button>
        <button class="icon" data-action="copy" type="button" title="Copy URL" aria-label="Copy URL"><svg aria-hidden="true"><use href="#i-copy"/></svg></button>
        <button class="icon" data-action="remove" type="button" title="Hide" aria-label="Hide this item"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
        <button class="btn primary" data-action="download" type="button"><svg aria-hidden="true"><use href="#i-download"/></svg><span>Download</span></button>
      </div>
      <div class="options" data-role="options" hidden>
        <label class="opt">
          <span>Save to</span>
          <input type="text" data-role="folder" list="recentFolders" placeholder="Default folder" spellcheck="false" />
        </label>
        <label class="opt check">
          <input type="checkbox" data-role="series" />
          <span>Series episode <small data-role="seriesHint"></small></span>
        </label>
        <div class="series-grid" data-role="seriesFields" hidden>
          <label class="opt"><span>Show</span><input type="text" data-role="show" spellcheck="false" /></label>
          <label class="opt narrow"><span>Season</span><input type="number" min="0" max="99" data-role="season" /></label>
          <label class="opt narrow"><span>Episode</span><input type="number" min="0" max="999" data-role="episode" /></label>
          <label class="opt check wide"><input type="checkbox" data-role="organize" /><span>File under <code>Show\Season 01\</code></span></label>
        </div>
      </div>
    </li>
  </template>
  <datalist id="recentFolders"></datalist>

  <template id="jobItemTpl">
    <li class="card job">
      <div class="row">
        <span class="status" data-role="status"></span>
        <span class="title" data-role="title"></span>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" data-role="bar"><div class="fill" data-role="fill"></div></div>
      <div class="row">
        <span class="meta" data-role="meta"></span>
        <span class="spacer"></span>
        <button class="icon" data-action="pause" type="button" title="Pause" aria-label="Pause"><svg aria-hidden="true"><use href="#i-pause"/></svg></button>
        <button class="icon" data-action="resume" type="button" title="Resume" aria-label="Resume"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
        <button class="icon" data-action="cancel" type="button" title="Cancel" aria-label="Cancel"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
        <button class="icon" data-action="open" type="button" title="Show in folder" aria-label="Show in folder"><svg aria-hidden="true"><use href="#i-folder"/></svg></button>
        <button class="icon" data-action="remove" type="button" title="Remove…" aria-label="Remove…"><svg aria-hidden="true"><use href="#i-trash"/></svg></button>
      </div>
      <div class="row confirm" data-role="confirm" hidden>
        <span>Remove this download?</span>
        <span class="spacer"></span>
        <button class="btn" data-action="remove-list" type="button">From list only</button>
        <button class="btn danger" data-action="remove-file" type="button">Delete file too</button>
      </div>
      <p class="error" data-role="error" hidden></p>
    </li>
  </template>

  <script src="lib/naming.js"></script>
  <script src="popup.js"></script>
</body>
</html>
